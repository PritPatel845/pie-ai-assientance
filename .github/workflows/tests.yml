name: Phase 0S Python checks

on:
  push:
    branches: ["phase-0s-implementation"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/pie
      - run: python -m pie doctor
