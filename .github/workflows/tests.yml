name: Phase 0S Python checks

on:
  push:
    branches: ["phase-0s-implementation"]
  pull_request:
    branches: ["main"]

concurrency:
  group: phase-0s-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Show Ruff format diff
        run: ruff format --diff .
      - name: Ruff format
        run: ruff format --check .
      - run: pytest -q
      - run: mypy src/pie
      - run: python -m pie doctor
