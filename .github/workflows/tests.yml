name: Phase 0S Python checks

on:
  push:
    branches: ["phase-0s-implementation"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Apply Ruff formatting and safe fixes
        run: |
          ruff format .
          ruff check --fix .
      - name: Commit formatting corrections
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: apply Ruff formatting"
            git push
          fi
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/pie
      - run: python -m pie doctor
