[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pie"
version = "0.1.0"
description = "Local-first macOS hand-gesture and voice assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.2.6"]

[project.optional-dependencies]
mac = ["opencv-contrib-python==4.11.0.86", "mediapipe==0.10.35", "pyautogui==0.9.54", "pyobjc-framework-Quartz==11.1", "pyobjc-framework-Cocoa==11.1", "sounddevice==0.5.6"]
dev = ["pytest==8.3.5", "pytest-timeout==2.3.1", "ruff==0.11.2", "mypy==1.15.0"]

[project.scripts]
pie = "pie.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"config" = ["config/pie.default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
