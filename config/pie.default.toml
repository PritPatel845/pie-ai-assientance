[app]
name = "pie"
log_level = "INFO"

[gesture]
camera = 0
preview = true
arm_hold_seconds = 2.0
steer_sensitivity = 0.004
state_hz = 10
model_path = ""
bindings_via_tools = true

[gesture.bindings]
thumb_up = "media.play"
thumb_down = "media.pause"
palm_push = "mac.mute"

[voice]
enabled = true
wake_words = ["hey pie", "pie", "pi", "jr", "j r", "jay r", "jarvis"]
listen_seconds = 20
language = "en"
# Local speech recognition: auto prefers MLX Whisper, then whisper.cpp.
stt_backend = "auto"
stt_model = "base.en"
# Empty selects the operating-system default input device.
input_device = ""
vad_threshold = 0.015
vad_min_speech_ms = 150
vad_end_silence_ms = 600
vad_max_utterance_s = 12.0
stt_idle_unload_s = 300
tts_enabled = true
tts_voice = "Samantha"
tts_rate = 185
# Audio is never sent to a cloud provider unless this is explicitly enabled.
allow_cloud_stt = false
debug_save_audio = false

[ui]
host = "127.0.0.1"
port = 8765

[brain]
enabled = true
cloud_order = ["anthropic", "openai"]
cli_providers_enabled = false
anthropic_model = ""
openai_model = ""
local_backend = "auto"
local_model = ""
max_steps = 8
total_timeout_s = 90
provider_timeout_s = 45
context_turns = 6
context_ttl_s = 600
default_cooldown_s = 3600
rate_limit_max_wait_s = 8
local_max_ram_gb = 6.0
local_keep_alive = "2m"

[safety]
sandbox_dir = "~/PieWorkspace"
allowed_folders = ["~/Desktop", "~/Documents", "~/Downloads", "~/PieWorkspace"]
confirm_timeout_s = 20
max_calls_per_10s = 10
max_confirm_prompts_per_min = 3
audit_path = "~/.pie/logs/audit.jsonl"

[tools]
dry_run = false
disabled = []
result_max_chars = 20000
